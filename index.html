<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="GHSS Naseer Killi School Public and Management Portal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GHSS Portal">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>GHSS Naseer Killi – School Portal</title>
  <style>
    :root { color-scheme: light; --navy:#102a43; --blue:#1769aa; --gold:#f4bd50; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Arial, sans-serif; color:#172b4d;
      background:linear-gradient(145deg,#eaf2f8,#f8fafc 55%,#fff4dc);
      display:flex; align-items:center; justify-content:center; padding:22px;
    }
    .app { width:min(100%,520px); }
    .brand { text-align:center; margin-bottom:24px; }
    .brand img { width:92px; height:92px; border-radius:24px; box-shadow:0 8px 24px #102a4326; }
    h1 { color:var(--navy); font-size:clamp(23px,5vw,30px); margin:14px 0 7px; line-height:1.2; }
    .sub { color:#526579; margin:0; font-size:15px; line-height:1.5; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:22px; padding:22px; box-shadow:0 14px 40px #102a4312; }
    .portal {
      display:flex; align-items:center; gap:15px; width:100%; padding:18px;
      border-radius:16px; text-decoration:none; color:white; margin:10px 0;
      box-shadow:0 7px 18px #102a4320; transition:transform .15s ease;
    }
    .portal:active { transform:scale(.985); }
    .public { background:linear-gradient(120deg,#1769aa,#2388c8); }
    .management { background:linear-gradient(120deg,#102a43,#234e70); }
    .symbol { width:48px; height:48px; flex:0 0 48px; display:grid; place-items:center; background:#ffffff24; border-radius:14px; font-size:25px; }
    .portal strong { display:block; font-size:18px; margin-bottom:4px; }
    .portal small { display:block; opacity:.9; font-size:13px; }
    .arrow { margin-left:auto; font-size:25px; }
    .install { display:none; width:100%; border:0; border-radius:14px; background:var(--gold); color:#263238; padding:15px; font-weight:700; font-size:16px; margin-top:16px; cursor:pointer; }
    .hint { text-align:center; font-size:12px; color:#66788a; line-height:1.55; margin:16px 4px 0; }
    .footer { text-align:center; color:#718096; font-size:12px; margin-top:17px; }
    @media (display-mode: standalone) { body { padding-top:max(22px, env(safe-area-inset-top)); padding-bottom:max(22px, env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <img src="./icon-192.png" alt="GHSS school portal icon">
      <h1>GOVT. HIGHER SECONDARY SCHOOL<br>NASEER KILLI, MARDAN</h1>
      <p class="sub">School Portal · Public &amp; Management</p>
    </header>

    <section class="card" aria-label="Choose portal">
      <a class="portal public" href="https://script.google.com/macros/s/AKfycbwA6UmZxZ4fyO6b0Z_2WIdvaTef7KHKEkddEQWJE8Ttp6FL33nSAJvMj3g4jTQgS3Do3Q/exec" target="_blank" rel="noopener">
        <span class="symbol" aria-hidden="true">🎓</span>
        <span><strong>Public Portal</strong><small>For students and parents</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="portal management" href="https://script.google.com/macros/s/AKfycbzX_p-E8NihAtg5vfXqB6yCIl1L8TMk1rPOeNv4rGruFLULtrViT5TeGvely7VvWGXw/exec" target="_blank" rel="noopener">
        <span class="symbol" aria-hidden="true">🛡️</span>
        <span><strong>Management Portal</strong><small>For teachers and administration</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <button id="installBtn" class="install" type="button">Install School App</button>
      <p class="hint" id="installHint">Install this portal on your phone's Home Screen for quick access.</p>
    </section>
    <p class="footer">GHSS Naseer Killi, Mardan</p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(err => {
          console.error("Service worker registration failed:", err);
        });
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    const installHint = document.getElementById("installHint");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "block";
      installBtn.textContent = "Install School App";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      installHint.textContent = "School App installed successfully.";
    });

    // iPhone/iPad: show the manual Add to Home Screen steps.
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (isIOS && !isStandalone) {
      installBtn.style.display = "block";
      installBtn.textContent = "How to Install on iPhone";
      installBtn.addEventListener("click", () => {
        alert("1. Open this page in Safari.\\n2. Tap the Share button.\\n3. Choose “Add to Home Screen”.\\n4. Tap “Add”.");
      });
      installHint.textContent = "On iPhone, open this page in Safari, tap Share, then Add to Home Screen.";
    }
  </script>
</body>
</html>
