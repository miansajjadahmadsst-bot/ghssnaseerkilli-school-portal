<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b4e">
<meta name="description" content="GHSS Naseer Killi Public and Management Digital Portals">
<link rel="manifest" href="./manifest.json">
<title>GHSS Naseer Killi — Digital School Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;
font-family:Arial,sans-serif;color:#173b60;background:linear-gradient(135deg,#eaf1f8,#fff7e6)}
main{width:min(100%,720px)}header{text-align:center;margin:0 0 25px}
h1{font-size:clamp(22px,4vw,32px);line-height:1.3;color:#102b4e;margin:0 0 8px}
header p{margin:0;color:#60758a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
a{display:block;text-decoration:none;color:white;padding:28px 22px;border-radius:20px;min-height:190px;
box-shadow:0 12px 30px #102b4e22;transition:transform .15s}
a:active{transform:scale(.985)}.pub{background:linear-gradient(135deg,#1769aa,#087e83)}
.mgmt{background:linear-gradient(135deg,#102b4e,#234e70)}
.icon{font-size:38px;margin-bottom:18px}strong{display:block;font-size:23px;margin-bottom:9px}
small{font-size:14px;line-height:1.5;opacity:.94}.foot{text-align:center;margin-top:20px;font-size:12px;color:#718096}
@media(max-width:560px){.grid{grid-template-columns:1fr}a{min-height:145px;padding:22px}.icon{margin-bottom:10px}}
</style>
</head>
<body><main>
<header><h1>GOVT. HIGHER SECONDARY SCHOOL<br>NASEER KILLI, MARDAN</h1>
<p>PUBLIC &amp; MANAGEMENT DIGITAL PORTAL</p></header>
<section class="grid">
<a class="pub" href="./public.html"><div class="icon">🎓</div><strong>Public Portal</strong><small>Complaints, Results &amp; DMC, Student Record</small></a>
<a class="mgmt" href="./management.html"><div class="icon">🛡️</div><strong>Management Portal</strong><small>E-Attendance, Student Records, Award List &amp; Examination</small></a>
</section><p class="foot">GHSS Naseer Killi, Mardan · Offline portal shell</p>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}
</script>
</body></html>
