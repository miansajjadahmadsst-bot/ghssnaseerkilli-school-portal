<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174f55"><meta name="description" content="GHSS Naseer Killi official Public Portal">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GHSS Public">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<title>GHSS Naseer Killi – Public Portal</title>
<style>
:root{--deep:#174f55;--green:#24736c;--gold:#d6b66b}*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#17343a;background:linear-gradient(145deg,#e6f0ec,#f8f5e9 60%,#dce9e5)}
.wrap{width:min(100%,520px);text-align:center}.card{background:#fff;border:1px solid #d9e4df;border-radius:26px;padding:24px 22px 20px;box-shadow:0 18px 55px #174f5526}
.logo{width:min(70vw,250px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:5px solid #e4d5a5;box-shadow:0 8px 26px #174f552e}
h1{color:var(--deep);font-size:clamp(22px,5vw,29px);line-height:1.25;margin:18px 0 8px}.sub{margin:0 0 22px;color:#60777a;font-size:15px}
.open{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:16px 18px;border-radius:15px;background:linear-gradient(120deg,var(--deep),var(--green));color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.install{display:none;width:100%;margin-top:12px;padding:15px 18px;border:2px solid var(--gold);border-radius:15px;background:#fffaf0;color:#59471e;font-weight:700;font-size:16px;cursor:pointer}
.note{color:#647779;font-size:13px;line-height:1.6;margin:16px 4px 0}.foot{color:#728382;font-size:12px;margin:16px 0 0}
</style></head><body><main class="wrap"><section class="card">
<img class="logo" src="./icon-512.png" alt="GHSS Naseer Killi school monogram">
<h1>GOVT. HIGHER SECONDARY SCHOOL<br>NASEER KILLI, MARDAN</h1><p class="sub">Official Public Portal</p>
<a class="open" href="https://script.google.com/macros/s/AKfycbwA6UmZxZ4fyO6b0Z_2WIdvaTef7KHKEkddEQWJE8Ttp6FL33nSAJvMj3g4jTQgS3Do3Q/exec" target="_blank" rel="noopener">Open Public Portal ↗</a>
<button class="install" id="installBtn" type="button">Install GHSS Public App</button>
<p class="note" id="hint">Install this app on your phone for quick access to the school Public Portal.</p></section><p class="foot">GHSS Naseer Killi, Mardan</p></main>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error))}
const b=document.getElementById("installBtn"),h=document.getElementById("hint");let promptEvent=null;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptEvent=e;b.style.display="block"});
b.addEventListener("click",async()=>{if(ios){alert("Install on iPhone:\n1. Open this page in Safari.\n2. Tap Share.\n3. Choose Add to Home Screen.\n4. Tap Add.");return}if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;b.style.display="none"}else{alert("Open your browser menu and choose Install app or Add to Home Screen.")}});
if(ios&&!standalone){b.style.display="block";b.textContent="How to Install on iPhone";h.textContent="On iPhone: open in Safari, tap Share, then Add to Home Screen."}
if(standalone){h.textContent="GHSS Public App is running from your Home Screen."}
</script></body></html>
